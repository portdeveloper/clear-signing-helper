# Copy into your Foundry repository after making the reviewed package tarball
# available at tooling/clear-signing-helper-0.4.0-preview.1.tgz (or an immutable internal URL).
name: Clear signing
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6831 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      # Commit the checksum reviewed with the tarball to this same directory.
      - run: sha256sum --check clear-signing-helper-0.4.0-preview.1.tgz.sha256
        working-directory: tooling
      - run: npm install --global --ignore-scripts ./tooling/clear-signing-helper-0.4.0-preview.1.tgz
      - run: forge build
      - run: clear-signing check --strict-portability --json
      - run: clear-signing test --json
