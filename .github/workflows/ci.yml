name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['22.22.3', '24.20.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6831 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: npm ci --ignore-scripts
      - name: Install pinned Solidity compiler and test reference contracts
        run: |
          forge test --root examples/standard
          forge test --root examples/custom-layout
          forge test --root examples/duplicate-contracts
      - run: npm test
      - run: npm run release:verify
      - name: Save verified candidate and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.os }}-node-${{ matrix.node }}
          if-no-files-found: error
          path: |
            release/*.tgz
            release/*.tgz.sha256
            release/release-verification.json
